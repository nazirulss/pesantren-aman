<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#196349"/>
      <stop offset="100%" stop-color="#0E4331"/>
    </linearGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA6D"/>
      <stop offset="100%" stop-color="#B68E42"/>
    </linearGradient>
  </defs>

  <!-- LOGO EMBLEM (Left) -->
  <g transform="translate(30, 20)">
    <!-- Outer Shield Outline -->
    <path d="M80 8 C115 8 148 24 150 48 C150 102 115 138 80 152 C45 138 10 102 10 48 C12 24 45 8 80 8 Z" 
          fill="url(#shieldGrad1)" stroke="#C7A45B" stroke-width="3" stroke-linejoin="round"/>

    <!-- Inner Border Line -->
    <path d="M80 16 C108 16 138 30 140 50 C140 96 110 128 80 141 C50 128 20 96 20 50 C22 30 52 16 80 16 Z" 
          fill="none" stroke="#F4F0E6" stroke-width="1.2" stroke-opacity="0.5"/>

    <!-- Dome (Kubah) Siluet Atas -->
    <path d="M80 26 C94 40 106 56 106 72 C106 73 54 73 54 72 C54 56 66 40 80 26 Z" 
          fill="#F4F0E6"/>
    
    <!-- Puncak Kubah (Bintang/Hilal Mini) -->
    <circle cx="80" cy="24" r="3" fill="url(#goldGrad1)"/>

    <!-- Lembaran Kitab Terbuka (Knowledge / Syariat) -->
    <path d="M80 94 C92 84 112 86 122 92 C122 110 94 118 80 124 C66 118 38 110 38 92 C48 86 68 84 80 94 Z" 
          fill="#FFFFFF" opacity="0.95"/>
    <path d="M80 96 L80 123" stroke="#145A42" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Lingkaran Perlindungan Aksen Emas -->
    <path d="M48 68 C58 56 102 56 112 68" fill="none" stroke="url(#goldGrad1)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- LOGO TEXT (Right) -->
  <g transform="translate(210, 52)">
    <!-- Main Title -->
    <text x="0" y="42" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" fill="#145A42" letter-spacing="1.5">
      PESANTREN <tspan fill="#C7A45B">AMAN</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="70" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#23966B" letter-spacing="3.2">
      GERAKAN PENGUATAN SISTEM PERLINDUNGAN SANTRI
    </text>

    <!-- Slogan Footnote -->
    <text x="2" y="94" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-style="italic" font-weight="400" fill="#5A6D63" letter-spacing="0.5">
      Menjaga Amanah • Melindungi Santri • Memuliakan Pesantren
    </text>

    <!-- Affiliation badge -->
    <g transform="translate(0, 108)">
      <rect x="0" y="0" width="168" height="20" rx="4" fill="#F4F0E6"/>
      <text x="8" y="14" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#145A42" letter-spacing="0.8">
        RABITHAH MA'AHID ISLAMIYAH NU
      </text>
    </g>
  </g>
</svg>
