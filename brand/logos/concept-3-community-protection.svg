<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <linearGradient id="commGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145A42"/>
      <stop offset="100%" stop-color="#23966B"/>
    </linearGradient>
    <linearGradient id="commGradB" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C7A45B"/>
      <stop offset="100%" stop-color="#E2C178"/>
    </linearGradient>
  </defs>

  <!-- LOGO EMBLEM (Left) -->
  <g transform="translate(35, 18)">
    <!-- Base subtle circle -->
    <circle cx="75" cy="80" r="72" fill="#F4F0E6" opacity="0.6"/>

    <!-- Intersecting Arc 1: The Community & Institutional Shield (Kiri & Bawah) -->
    <path d="M75 18 C110 18 138 46 138 82 C138 120 106 142 75 142 C44 142 12 120 12 82 C12 55 30 32 54 22" 
          fill="none" stroke="url(#commGradA)" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Intersecting Arc 2: Golden Shield of Care & Protection (Kanan atas ke dalam) -->
    <path d="M75 32 C98 32 122 52 122 80 C122 108 98 128 75 128 C56 128 40 114 36 96" 
          fill="none" stroke="url(#commGradB)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Core Center: Siluet Santri / Generasi Tunas dalam Naungan Kubah -->
    <!-- Dome Top -->
    <path d="M75 52 C82 60 88 70 88 78 L62 78 C62 70 68 60 75 52 Z" fill="#145A42"/>
    <!-- Small Halo / Focus -->
    <circle cx="75" cy="46" r="3.5" fill="#C7A45B"/>

    <!-- Dynamic Caring Wings (Kubah & Tangan Bertaut) -->
    <path d="M52 102 C58 92 68 86 75 86 C82 86 92 92 98 102 C90 108 82 110 75 110 C68 110 60 108 52 102 Z" 
          fill="url(#commGradA)"/>

    <!-- 3 Dot Accents: Santri, Pesantren, Masyarakat -->
    <circle cx="58" cy="120" r="3" fill="#23966B"/>
    <circle cx="75" cy="122" r="3.5" fill="#C7A45B"/>
    <circle cx="92" cy="120" r="3" fill="#145A42"/>
  </g>

  <!-- LOGO TEXT (Right) -->
  <g transform="translate(210, 52)">
    <!-- Main Title -->
    <text x="0" y="42" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" fill="#145A42" letter-spacing="1.5">
      PESANTREN <tspan fill="#145A42">AMAN</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="70" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#23966B" letter-spacing="3.2">
      GERAKAN PENGUATAN SISTEM PERLINDUNGAN SANTRI
    </text>

    <!-- Slogan Footnote -->
    <text x="2" y="94" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-style="italic" font-weight="400" fill="#5A6D63" letter-spacing="0.5">
      Menjaga Amanah • Melindungi Santri • Memuliakan Pesantren
    </text>

    <!-- Affiliation badge -->
    <g transform="translate(0, 108)">
      <rect x="0" y="0" width="168" height="20" rx="4" fill="#F4F0E6"/>
      <text x="8" y="14" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#145A42" letter-spacing="0.8">
        RABITHAH MA'AHID ISLAMIYAH NU
      </text>
    </g>
  </g>
</svg>
