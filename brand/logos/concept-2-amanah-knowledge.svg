<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <linearGradient id="mihrabGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23966B"/>
      <stop offset="100%" stop-color="#145A42"/>
    </linearGradient>
    <linearGradient id="warmGold2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C7A45B"/>
      <stop offset="100%" stop-color="#E5CA82"/>
    </linearGradient>
  </defs>

  <!-- LOGO EMBLEM (Left) -->
  <g transform="translate(35, 18)">
    <!-- Soft circular backdrop -->
    <circle cx="75" cy="80" r="72" fill="#F4F0E6" opacity="0.85"/>

    <!-- Outer Mihrab Arch (Gerbang Pengasuhan) -->
    <path d="M75 16 C105 32 122 55 122 88 L122 135 C122 137 120 139 118 139 L32 139 C30 139 28 137 28 135 L28 88 C28 55 45 32 75 16 Z" 
          fill="none" stroke="url(#mihrabGrad2)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Inner Mihrab Glow -->
    <path d="M75 28 C98 42 110 61 110 88 L110 130 L40 130 L40 88 C40 61 52 42 75 28 Z" 
          fill="#145A42" opacity="0.08"/>

    <!-- Tangan Merangkul / Sayap Amanah Melindungi Santri (Dua Lengkungan Pelindung) -->
    <path d="M42 108 C42 86 60 70 75 80 C90 70 108 86 108 108 C100 120 86 126 75 126 C64 126 50 120 42 108 Z" 
          fill="url(#mihrabGrad2)"/>

    <!-- Buku Terbuka / Kitab di Pangkuan (Warna Emas & Putih) -->
    <path d="M75 92 C68 86 56 86 48 90 L52 112 C60 108 70 108 75 112 Z" fill="#FFFFFF"/>
    <path d="M75 92 C82 86 94 86 102 90 L98 112 C90 108 80 108 75 112 Z" fill="#FFFFFF"/>
    <line x1="75" y1="92" x2="75" y2="114" stroke="url(#warmGold2)" stroke-width="2.5"/>

    <!-- Bintang Nur Kebaikan di Puncak Mihrab -->
    <path d="M75 36 L77.5 42 L84 43 L79 47.5 L80.5 54 L75 50.5 L69.5 54 L71 47.5 L66 43 L72.5 42 Z" 
          fill="url(#warmGold2)"/>
  </g>

  <!-- LOGO TEXT (Right) -->
  <g transform="translate(210, 52)">
    <!-- Main Title -->
    <text x="0" y="42" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" fill="#145A42" letter-spacing="1.5">
      PESANTREN <tspan fill="#23966B">AMAN</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="70" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#C7A45B" letter-spacing="3.2">
      GERAKAN PENGUATAN SISTEM PERLINDUNGAN SANTRI
    </text>

    <!-- Slogan Footnote -->
    <text x="2" y="94" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-style="italic" font-weight="400" fill="#5A6D63" letter-spacing="0.5">
      Menjaga Amanah • Melindungi Santri • Memuliakan Pesantren
    </text>

    <!-- Affiliation badge -->
    <g transform="translate(0, 108)">
      <rect x="0" y="0" width="168" height="20" rx="4" fill="#E8F3EE"/>
      <text x="8" y="14" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#145A42" letter-spacing="0.8">
        RABITHAH MA'AHID ISLAMIYAH NU
      </text>
    </g>
  </g>
</svg>
